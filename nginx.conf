server {
    listen 80;
    root /usr/share/nginx/html;

    # Emit relative redirects (Location: /) so they work behind port mappings / reverse proxies.
    absolute_redirect off;

    # Any 404 redirects to the home page instead of showing the nginx error page.
    error_page 404 = @home;
    location @home { return 302 /; }

    location = / { try_files /index.html =404; }

    # Exception: a missing panoramas_cache.json is a real 404 (JSON body), not a redirect,
    # so the page's fetch() fails clearly instead of receiving index.html.
    location = /panoramas_cache.json { error_page 404 = @cache_missing; }
    location @cache_missing {
        default_type application/json;
        return 404 '{"error":"panoramas_cache.json not found"}';
    }

    # Allowlist: only the site files (and the other JSON file the page fetches).
    location ~ ^/(index\.html|styles\.css|script\.js|weather_codes_data\.json)$ { }

    # Everything else (e.g. fetch_panoramas.sh) is not exposed.
    location / { return 404; }
}
