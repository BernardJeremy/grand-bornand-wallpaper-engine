server {
    listen 80;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; }

    # Allowlist: only the site files (and the two JSON files the page fetches).
    location ~ ^/(index\.html|styles\.css|script\.js|weather_codes_data\.json|panoramas_cache\.json)$ { }

    # Everything else (e.g. fetch_panoramas.sh) is not exposed.
    location / { return 404; }
}
